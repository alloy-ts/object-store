[package]
name = "my-addon-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["fs", "tokio"]
fs = ["object_store/fs"]
tokio = ["object_store/tokio"]
aws = ["object_store/aws"]
azure = ["object_store/azure"]
gcp = ["object_store/gcp"]
http = ["object_store/http"]

[dependencies]
napi = { version = "3", features = ["tokio_rt"] }
napi-derive = "3"
object_store = "0.14.2"
futures = "0.3"
url = "2"
chrono = "0.4"

[build-dependencies]
napi-build = "2"

[package]
name = "alloy-object-store-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "tokio_rt", "napi4"] }
napi-derive = "3"
object_store = { version = "0.14.2", default-features = false, features = ["fs", "tokio", "http-base"] }
bytes = "1"
futures = "0.3"
url = "2"
chrono = "0.4"
tokio = { version = "1", features = ["io-util", "sync", "rt", "rt-multi-thread", "time"] }
http = "1"
http-body-util = "0.1.2"
async-trait = "0.1"
humantime = "2.1"

[build-dependencies]
napi-build = "2"
